name: Docker Image Workflow
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-linux:
    defaults:
      run:
        # Ensures environment gets sourced right
        shell: bash -e -l {0}
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # Lots of daryl's codes use aliases defined in /etc/hosts
    - name: Add /etc/hosts entries
      run: |
        cat .github/workflows/etchosts.txt | sudo tee -a /etc/hosts

    - name: Setup micromamba
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: environment.yml
        init-shell: >-
          bash
        condarc: |
          channels:
            - conda-forge
        create-args: >-
          python=3.14
          mamba
        environment-name: prod
        cache-environment: true

    - name: Copy IEM sync_stations.py script
      run: |
        curl --fail --silent --show-error --location \
          --retry 5 --retry-delay 5 --retry-all-errors \
          --connect-timeout 15 --max-time 120 \
          -o scripts/sync_stations.py https://raw.githubusercontent.com/akrherz/iem/main/scripts/dbutil/sync_stations.py

    - name: Run Docker build script
      run: bash build_docker_image.sh

    # - name: Setup upterm session
    #  if: ${{ failure() }}
    #  uses: lhotari/action-upterm@v1
    #  with:
    #    limit-access-to-actor: true

    - name: Publish to Github Container Registry
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        CR_PAT: ${{ secrets.CR_PAT }}
      run: |
        echo $CR_PAT | docker login ghcr.io -u akrherz --password-stdin
        docker push ghcr.io/akrherz/iem_database:test_data
        docker push ghcr.io/akrherz/iem_database:no_test_data

    - name: Clean up old container images
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/delete-package-versions@v5
      with:
        token: ${{ secrets.CR_PAT }}
        package-name: 'iem_database'
        package-type: 'container'
        min-versions-to-keep: 10
        delete-only-untagged-versions: true
