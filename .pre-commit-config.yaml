ci:
  autoupdate_schedule: quarterly
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.17.3"
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/concur1/sqruff-pre-commit
    rev: v0.43.0
    hooks:
      # Run the formatter.
      - id: sqruff-fix
        exclude: ^data/|^upgrade/
      # Run the linter.
      - id: sqruff-lint
        exclude: ^data/|^upgrade/
